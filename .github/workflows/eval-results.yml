name: eval-results

on:
  pull_request:
    paths:
      - "evals/runs/**/verdicts/*.json"
      - "evals/runs/**/report.md"
      - "evals/runs/**/author-reviews/*.json"
      - "evals/score_eval.py"
      - "evals/author-review.md"
      - "scripts/review_eval_run.py"
      - "tests/test_author_review.py"
      - ".github/workflows/eval-results.yml"
  push:
    branches: [main]
    paths:
      - "evals/runs/**/verdicts/*.json"
      - "evals/runs/**/report.md"
      - "evals/runs/**/author-reviews/*.json"
      - "evals/score_eval.py"
      - "evals/author-review.md"
      - "scripts/review_eval_run.py"
      - "tests/test_author_review.py"
      - ".github/workflows/eval-results.yml"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Optional retained run ID; leave blank to process every scored run"
        required: false
        type: string
      require_author_reviews:
        description: "Fail unless every selected case has a valid author review"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-24.04
    env:
      RUN_ID: ${{ inputs.run_id || '' }}
      REQUIRE_AUTHOR_REVIEWS: ${{ inputs.require_author_reviews || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Recompute committed score reports
        shell: bash
        run: |
          shopt -s nullglob
          if [[ -n "$RUN_ID" ]]; then
            candidates=("evals/runs/$RUN_ID")
          else
            candidates=(evals/runs/*)
          fi
          reports=()
          scored=0
          for run in "${candidates[@]}"; do
            [[ -f "$run/run.json" && -d "$run/verdicts" ]] || continue
            scored=$((scored + 1))
            id="${run##*/}"
            python3 evals/score_eval.py --run "$id"
            git ls-files --error-unmatch "$run/report.md" >/dev/null
            reports+=("$run/report.md")
          done
          if [[ "$scored" -eq 0 ]]; then
            echo "No scored runs matched the workflow input." >&2
            exit 2
          fi
          git diff --exit-code -- "${reports[@]}"

      - name: Prepare packets and validate committed author reviews
        shell: bash
        run: |
          args=(
            ci
            --runs-root evals/runs
            --output-dir "$RUNNER_TEMP/author-review"
          )
          if [[ -n "$RUN_ID" ]]; then
            args+=(--run-id "$RUN_ID")
          fi
          if [[ "$REQUIRE_AUTHOR_REVIEWS" == "true" ]]; then
            args+=(--require-author-reviews)
          fi
          python3 scripts/review_eval_run.py "${args[@]}"

      - name: Test the author-review contract
        run: python3 tests/test_author_review.py

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          echo "### Eval-result intake" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$RUNNER_TEMP/author-review/ci-manifest.json" ]]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/author-review/ci-manifest.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Packet preparation did not complete." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload author-review packets and backlogs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: author-review-packets-${{ github.run_id }}
          path: ${{ runner.temp }}/author-review/
          if-no-files-found: warn
          retention-days: 30
