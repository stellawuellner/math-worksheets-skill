name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install "sympy>=1.12"
      - name: Regression suite (verify.py contract)
        run: bash tests/run_tests.sh
      - name: Audit-fix suite (soundness regression pins)
        run: python3 tests/test_audit_fixes.py
