name: cas-canary

# The verifier's guarantee — 0 false accepts on 6,993 corpus checks — is a
# statement about a CAS at a version, measured on sympy 1.14.0. verify.py
# stamps every run with the version it used and names the drift when there is
# any, but a stamp makes drift VISIBLE, not EARLY: the first person to learn
# that a new sympy answers differently would be an author mid-build. This job
# learns it first, on a schedule, against the newest sympy on PyPI.
#
# It runs the same two instruments CI already trusts:
#   - the full fixture suite (run_tests.sh), which pins hundreds of expected
#     PASS/FAIL/MANUAL outcomes per type — the sensitive half, because a CAS
#     that "improves" simplify() flips these first;
#   - the GSM8K corpus (accept-correct + reject-perturbed), the source of the
#     0-false-accepts number itself.
#
# A red run here does NOT mean the skill is broken today — production still
# runs the measured version. It means the NEXT sympy needs the baseline
# re-established before anyone upgrades: re-run the corpora on it, update
# MEASURED_SYMPY in scripts/verify.py, and record what changed.

on:
  schedule:
    # Weekly, Monday 06:23 UTC. Sympy releases a handful of times a year, so
    # weekly is early enough to beat any distro or pip upgrade to the answer
    # while spending ~5 CI minutes a week. Off-hour minute to be polite to
    # the shared cron load.
    - cron: "23 6 * * 1"
  workflow_dispatch: {}

jobs:
  latest-sympy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poppler and the NEWEST sympy (deliberately unpinned)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          # --upgrade with no bound is the whole point of this job. Every
          # other workflow pins; this one asks what the future breaks.
          pip install --upgrade sympy
          python3 -c "import sympy; print('canary sympy:', sympy.__version__)"

      - name: Report the version under test
        run: |
          {
            echo "### CAS canary"
            echo '```'
            python3 - <<'EOF'
          import importlib.util, sympy
          spec = importlib.util.spec_from_file_location("v", "scripts/verify.py")
          v = importlib.util.module_from_spec(spec); spec.loader.exec_module(v)
          print(f"under test : sympy {sympy.__version__}")
          print(f"measured on: sympy {v.MEASURED_SYMPY}")
          print(f"floor      : sympy {'.'.join(map(str, v.MIN_SYMPY))}")
          EOF
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fixture suite under the newest sympy
        run: bash tests/run_tests.sh

      - name: GSM8K corpus under the newest sympy
        run: |
          curl -sSL --retry 3 -o /tmp/gsm8k_test.jsonl \
            https://raw.githubusercontent.com/openai/grade-school-math/master/grade_school_math/data/test.jsonl
          python3 tests/eval_gsm8k.py /tmp/gsm8k_test.jsonl \
            --report /tmp/gsm8k_canary.json
          # eval_gsm8k.py already exits 1 on any false accept — the guarantee
          # itself failing. The check below adds the SOFTER regression it
          # deliberately tolerates: a drop in accept-correct means the new CAS
          # answers some ground-truth checks differently, which is exactly the
          # early warning this job exists to give.
          python3 - <<'EOF'
          import json
          stats = json.load(open("/tmp/gsm8k_canary.json"))["stats"]
          parseable = stats["pass"] + stats["fail"]
          print(f"accept-correct {stats['pass']}/{parseable}, "
                f"false accepts {stats['perturbed_false_accepts']}")
          assert stats["perturbed_false_accepts"] == 0, "false accepts"
          assert stats["fail"] == 0, (
              f"{stats['fail']} ground-truth checks now FAIL under the newest "
              "sympy - the baseline needs re-establishing before any upgrade")
          EOF

      - name: What a red run means
        if: failure()
        run: |
          {
            echo "### CAS canary is RED"
            echo "The newest sympy answers differently from the measured baseline."
            echo "Production is unaffected (it runs the measured version); do not"
            echo "upgrade sympy anywhere until the corpora are re-run on the new"
            echo "version, MEASURED_SYMPY in scripts/verify.py is updated, and the"
            echo "differences are recorded in the changelog."
          } >> "$GITHUB_STEP_SUMMARY"
